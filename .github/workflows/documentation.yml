name: Documentation

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
  workflow_dispatch:

jobs:
  Documentation:
    name: Documentation
    runs-on: ubuntu-latest

    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          show-versioninfo: true               # this causes versioninfo to be printed to the action log
      - uses: julia-actions/cache@v3
      # AbstractMultiscaleTransforms is not registered and the code needs the
      # development version of MultiscaleFilterBanks: clone both next to this
      # repository and develop them (see dev/bootstrap.jl).
      - name: Check out AbstractMultiscaleTransforms and MultiscaleFilterBanks
        run: |
          git clone --depth 1 https://github.com/hakkelt/AbstractMultiscaleTransforms.jl ../AbstractMultiscaleTransforms
          git clone --depth 1 https://github.com/hakkelt/MultiscaleFilterBanks.jl ../MultiscaleFilterBanks
      - name: Develop the sibling checkouts
        run: julia --project=. dev/bootstrap.jl
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
